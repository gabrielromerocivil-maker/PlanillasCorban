name: Desplegar a Cloudflare Pages

# Se ejecuta automáticamente en cada push a main.
# También se puede lanzar a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # 1) Descarga el contenido del repositorio en el runner de GitHub.
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # 2) Publica los archivos en Cloudflare Pages usando Wrangler.
      #    Requiere dos secretos configurados en el repositorio (ver README):
      #      - CLOUDFLARE_API_TOKEN
      #      - CLOUDFLARE_ACCOUNT_ID
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ⚠️ IMPORTANTE: reemplaza "planillascorban" por el nombre EXACTO de tu
          #    proyecto en Cloudflare Pages (Workers & Pages → tu proyecto).
          command: pages deploy . --project-name=planillascorban --branch=main
